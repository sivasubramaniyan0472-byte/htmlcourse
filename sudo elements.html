<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="sudo elements.css">

    <title>Pseudo Elements Example</title>
</head>

<body>

    <h1>Pseudo Elements</h1>
    <h2>1. Placeholder</h2>

    <input
        type="text"
        placeholder="Enter your name">

    <h2>2. Marker</h2>

    <ul type="square">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>
    <h2>3. File Selector Button</h2>
    <input type="file">
</body>
</html>
